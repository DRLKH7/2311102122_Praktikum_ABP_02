<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajax Profil</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 18px 35px rgba(47, 63, 84, 0.15);
            padding: 32px;
            width: min(520px, 90vw);
            text-align: center;
        }

        h1 {
            margin-bottom: 8px;
            color: #172b4d;
        }

        p {
            margin-top: 0;
            margin-bottom: 24px;
            color: #556179;
            line-height: 1.6;
        }

        button {
            background: #0052cc;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px 26px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #003f9a;
        }

        #hasil-profil {
            margin-top: 28px;
            padding: 18px 20px;
            border-radius: 12px;
            border: 1px solid #d9e2ec;
            background: #f9fbff;
            color: #1f2937;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Profil Ajax</h1>
        <p>Tekan tombol untuk mengambil data profil dari server tanpa reload halaman.</p>
        <button id="tampilkanBtn">Tampilkan Profil</button>
        <div id="hasil-profil">Klik tombol untuk melihat data.</div>
    </div>

    <script>
        const button = document.getElementById('tampilkanBtn');
        const hasilProfil = document.getElementById('hasil-profil');

        button.addEventListener('click', async () => {
            hasilProfil.textContent = 'Memuat data...';

            try {
                const response = await fetch('data.php');
                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const data = await response.json();
                hasilProfil.textContent = `Nama: ${data.nama} | Pekerjaan: ${data.pekerjaan} | Lokasi: ${data.lokasi}`;
            } catch (error) {
                hasilProfil.textContent = 'Gagal memuat data. ' + error.message;
            }
        });
    </script>
</body>
</html>
