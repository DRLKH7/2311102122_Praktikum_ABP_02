<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<title>Form Reservasi</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">

<a class="navbar-brand" href="/">Hotel Management</a>

<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse justify-content-end" id="nav">
<ul class="navbar-nav">

<li><a class="nav-link" href="/">Dashboard</a></li>
<li><a class="nav-link active" href="/form">Tambah Reservasi</a></li>
<li><a class="nav-link" href="/data">Data Reservasi</a></li>

</ul>
</div>

</div>
</nav>

<!-- CONTENT -->
<div class="container mt-5">

<div class="text-center mb-4">
<img src="/image.png" style="width:90px;">
<h3 class="mt-2">Form Reservasi Hotel</h3>
<p style="color:#ccc">Silakan isi data tamu dengan benar</p>
</div>

<div class="form-card">

<form id="formReservasi">

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Nama</label>
<input name="nama" class="form-control" placeholder="Masukkan nama">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">NIK</label>
<input name="nik" class="form-control" placeholder="Masukkan NIK">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">No HP</label>
<input name="hp" class="form-control" placeholder="08xxxxxxxxxx">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Tipe Kamar</label>
<select name="kamar" class="form-control">
<option>Standard</option>
<option>Deluxe</option>
<option>Suite</option>
</select>
</div>

<div class="col-md-12 mb-3">
<label class="form-label">Alamat</label>
<textarea name="alamat" class="form-control" rows="3"></textarea>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Checkin</label>
<input type="date" name="checkin" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Checkout</label>
<input type="date" name="checkout" class="form-control">
</div>

</div>

<div class="text-end">
<button class="btn btn-primary px-4">Simpan Reservasi</button>
</div>

</form>

</div>

</div>

<script>
$("#formReservasi").submit(function(e){
e.preventDefault()

$.post("/api/reservasi",$(this).serialize(),function(){
alert("Reservasi berhasil")
window.location="/data"
})
})
</script>

</body>
</html>
